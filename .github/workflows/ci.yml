name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build MacSpaces
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check single-release policy
        run: ./Scripts/check-release-policy.sh

      - name: Check updater revisions
        run: ./Scripts/check-update-revisions.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build
        run: >
          xcodebuild
          -project MacSpaces.xcodeproj
          -scheme MacSpaces
          -configuration Release
          -derivedDataPath build
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MacSpaces
          path: build/Build/Products/Release/MacSpaces.app
