name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Checks and the Release build run as parallel jobs; the commit passes when both do.
jobs:
  checks:
    name: Regression checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check single-release policy
        run: ./Scripts/check-release-policy.sh

      - name: Check updater revisions
        run: ./Scripts/check-update-revisions.sh

      - name: Check core lifecycle and action routing
        run: ./Scripts/check-core.sh

      - name: Check appearance migration and contrast
        run: ./Scripts/check-appearance.sh

      - name: Check playback capability and routing safety
        run: ./Scripts/check-playback.sh

      - name: Check agent hook installation
        run: ./Scripts/check-agent-hooks.sh
      - name: Notes migration and conflicts
        run: Scripts/check-notes.sh

      - name: Rich clipboard and privacy
        run: Scripts/check-clipboard.sh

      - name: Calculator arithmetic and conversions
        run: Scripts/check-calculator.sh

      - name: Teleprompter voice following
        run: Scripts/check-prompter.sh

      - name: Messages recipient and draft safety
        run: Scripts/check-messages.sh

      - name: Read-only incoming Messages fixtures
        run: bash Scripts/check-incoming-messages.sh

      - name: Check desktop window behavior
        run: ./Scripts/check-window.sh

  build:
    name: Build MacSpaces
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build
        run: >
          xcodebuild
          -project MacSpaces.xcodeproj
          -scheme MacSpaces
          -configuration Release
          -derivedDataPath build
          -skipPackagePluginValidation
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MacSpaces
          path: build/Build/Products/Release/MacSpaces.app
