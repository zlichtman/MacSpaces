name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main replaces the commit, so an older run is no longer needed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks and a Debug arm64 build run as parallel jobs; the commit passes when both do.
# (The release build is optimized, universal and verified by Scripts/package-release.sh.)
jobs:
  checks:
    name: Regression checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check single-release policy
        run: ./Scripts/check-release-policy.sh

      - name: Check updater revisions
        run: ./Scripts/check-update-revisions.sh

      - name: Check core lifecycle and action routing
        run: ./Scripts/check-core.sh

      - name: Check appearance migration and contrast
        run: ./Scripts/check-appearance.sh

      - name: Check playback capability and routing safety
        run: ./Scripts/check-playback.sh

      - name: Check lyric matching and timing
        run: ./Scripts/check-lyrics.sh

      - name: Check agent hook installation
        run: ./Scripts/check-agent-hooks.sh
      - name: Notes migration and conflicts
        run: Scripts/check-notes.sh

      - name: Rich clipboard and privacy
        run: Scripts/check-clipboard.sh

      - name: Transactional file tools and completed downloads
        run: Scripts/check-file-tools.sh

      - name: Calculator arithmetic and conversions
        run: Scripts/check-calculator.sh

      - name: Teleprompter voice following
        run: Scripts/check-prompter.sh

      - name: Messages recipient and draft safety
        run: Scripts/check-messages.sh

      - name: Read-only incoming Messages fixtures
        run: bash Scripts/check-incoming-messages.sh

      - name: Coding statistics
        run: Scripts/check-coding.sh

      - name: Settings search routing
        run: Scripts/check-settings-search.sh

      - name: Check desktop window behavior
        run: ./Scripts/check-window.sh

      - name: Privileged power helper contract
        run: ./Scripts/check-power-helper.sh

  build:
    name: Build MacSpaces
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      # A Debug, Apple-silicon-only compile check with the CI compiler (owner, 2.100: fast
      # CI). The release build (Scripts/package-release.sh) is optimized and universal.
      - name: Build
        run: >
          xcodebuild
          -project MacSpaces.xcodeproj
          -scheme MacSpaces
          -configuration Debug
          -derivedDataPath build
          -clonedSourcePackagesDirPath build/SourcePackages
          -skipPackagePluginValidation
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          build
