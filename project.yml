name: MacSpaces
options:
  minimumXcodeGenVersion: "2.38.0"
  projectFormat: xcode15_0
  xcodeVersion: "15.0"
  bundleIdPrefix: dev.opensource
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

targets:
  MacSpaces:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Vendor/**/README.md"
          - "Vendor/**/LICENSE"
    dependencies:
      - package: SwiftTerm
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: MacSpaces
        CFBundleDisplayName: MacSpaces
        CFBundleShortVersionString: "2.89"
        CFBundleVersion: "89"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        NSMicrophoneUsageDescription: MacSpaces uses the microphone only when you start on-device dictation or voice-following teleprompter. Audio stays on your Mac.
        NSSpeechRecognitionUsageDescription: MacSpaces recognises speech on this Mac for dictation and voice-following teleprompter; it never sends audio to a server.
        NSCameraUsageDescription: MacSpaces uses the camera for the notch Mirror tab so you can quickly check yourself before a call.
        NSCameraUseContinuityCameraDeviceType: true
        NSCalendarsUsageDescription: MacSpaces shows today's events in the Calendar widget.
        NSCalendarsFullAccessUsageDescription: MacSpaces shows today's events in the Calendar widget.
        NSRemindersUsageDescription: MacSpaces shows and completes reminders in the Todos widget.
        NSRemindersFullAccessUsageDescription: MacSpaces shows and completes reminders in the Todos widget.
        NSLocationWhenInUseUsageDescription: MacSpaces uses your location to show local weather. Coordinates are only sent to the Open-Meteo forecast API.
        NSLocationUsageDescription: MacSpaces uses your location to show local weather. Coordinates are only sent to the Open-Meteo forecast API.
        NSBluetoothAlwaysUsageDescription: MacSpaces reads your already-paired Bluetooth devices to show their battery levels in the Battery widget. It does not scan for or track nearby devices.
        NSAppleEventsUsageDescription: MacSpaces uses AppleScript for explicitly requested Messages replies, meeting controls, quick actions, Music playlist controls, unread counts, and media metadata from Music, Spotify, or your active browser when system-wide media info is unavailable.
        NSServices:
          - NSMenuItem:
              default: Add to MacSpaces Tray
            NSMessage: addToTray
            NSPortName: MacSpaces
            NSSendTypes: [public.file-url]
          - NSMenuItem:
              default: MacSpaces File Tools
            NSMessage: fileTools
            NSPortName: MacSpaces
            NSSendTypes: [public.file-url]
        NSHumanReadableCopyright: MIT licensed open-source software.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opensource.MacSpaces
        ARCHS: "arm64 x86_64"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/MacSpaces.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 28LJG7MXT3
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
