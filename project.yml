name: MacSpaces
options:
  minimumXcodeGenVersion: "2.38.0"
  projectFormat: xcode15_0
  xcodeVersion: "15.0"
  bundleIdPrefix: dev.opensource
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  MacSpaces:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: MacSpaces
        CFBundleDisplayName: MacSpaces
        CFBundleShortVersionString: "1.3.11"
        CFBundleVersion: "17"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        NSCameraUsageDescription: MacSpaces uses the camera for the notch Mirror tab so you can quickly check yourself before a call.
        NSMicrophoneUsageDescription: MacSpaces records audio for the Voice Memo widget. Recordings stay in your Documents folder.
        NSAudioCaptureUsageDescription: MacSpaces captures audio only from apps you choose in the Audio Controls mixer so it can apply that app's saved volume or mute setting.
        NSCalendarsUsageDescription: MacSpaces shows today's events in the Calendar widget.
        NSCalendarsFullAccessUsageDescription: MacSpaces shows today's events in the Calendar widget.
        NSRemindersUsageDescription: MacSpaces shows and completes reminders in the Todos widget.
        NSRemindersFullAccessUsageDescription: MacSpaces shows and completes reminders in the Todos widget.
        NSLocationWhenInUseUsageDescription: MacSpaces uses your location to show local weather. Coordinates are only sent to the Open-Meteo forecast API.
        NSLocationUsageDescription: MacSpaces uses your location to show local weather. Coordinates are only sent to the Open-Meteo forecast API.
        NSBluetoothAlwaysUsageDescription: MacSpaces reads connection changes for your already-paired Bluetooth devices to show brief notch live activities. It does not scan for or track nearby devices.
        NSAppleEventsUsageDescription: MacSpaces uses AppleScript for quick actions, unread counts, and media metadata from Music, Spotify, or your active browser when system-wide media info is unavailable.
        NSDesktopFolderUsageDescription: MacSpaces reads your Desktop to list recent screenshots in the Screenshots widget.
        NSDownloadsFolderUsageDescription: MacSpaces reads your Downloads folder to list recent files in the Downloads widget.
        NSDocumentsFolderUsageDescription: MacSpaces saves Voice Memo recordings to your Documents folder.
        NSHumanReadableCopyright: MIT licensed open-source software.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opensource.MacSpaces
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/MacSpaces-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/MacSpaces.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
